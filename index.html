<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SagayaMary Sagayaradj, Ph.D.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal: #0F6E56;
    --teal-light: #E1F5EE;
    --teal-mid: #1D9E75;
    --sand: #F7F5F0;
    --dark: #1C1C1A;
    --muted: #6B6B66;
    --border: #DDD9D0;
    --white: #ffffff;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--sand);
    color: var(--dark);
    font-size: 15px;
    line-height: 1.7;
  }

  /* NAV */
  nav {
    position: sticky;
    top: 0;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
  }
  nav .brand {
    font-family: 'Crimson Pro', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--teal);
    letter-spacing: 0.01em;
  }
  nav ul {
    list-style: none;
    display: flex;
    gap: 2rem;
  }
  nav a {
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  nav a:hover { color: var(--teal); }

  /* LAYOUT */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 2rem;
  }

  section {
    padding: 4rem 0;
    border-bottom: 1px solid var(--border);
  }
  section:last-child { border-bottom: none; }

  h2.section-title {
    font-family: 'Crimson Pro', serif;
    font-size: 1.9rem;
    font-weight: 600;
    color: var(--dark);
    margin-bottom: 2rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--teal);
    display: inline-block;
  }

  /* HERO */
  #about {
    padding: 5rem 0 4rem;
    background: var(--white);
    border-bottom: 1px solid var(--border);
  }
  .about-grid {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 3rem;
    align-items: start;
  }
